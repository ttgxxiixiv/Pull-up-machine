name: Publish to GitHub Pages

on:
  push:
    branches: [main, master, claude/pullup-training-diary-9slhdm]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp version into app and service worker
        run: |
          VERSION="${GITHUB_SHA::7}"
          sed -i "s/__BUILD__/$VERSION/" sw.js app.js
          echo "Version $VERSION"
      - name: Build single-file version
        run: node build.mjs "${GITHUB_SHA::7}"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
